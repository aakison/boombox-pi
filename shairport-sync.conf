// /etc/shairport-sync.conf -- Shairport Sync (AirPlay) configuration
// Unspecified settings keep Shairport Sync's built-in defaults.

general =
{
	// Name advertised to AirPlay clients.
	name = "Boombox";
};

sessioncontrol =
{
	// Shairport Sync execs these directly (no shell), so /bin/sh -c is required
	// for the redirect. The FIFO is created by install.sh and again by AirPlay.
	run_this_before_play_begins = "/bin/sh -c \"echo AIRPORT_CONNECTED > /tmp/boombox-events\"";
	run_this_after_play_ends = "/bin/sh -c \"echo AIRPORT_DISCONNECTED > /tmp/boombox-events\"";
	// Don't stall playback if nothing is reading the FIFO yet.
	wait_for_completion = "no";
};
