pcm.!default {
    type plug
    slave.pcm "mixer"
}

# Duplicates the mixed signal to the real DAC and to the snd-aloop capture
# side (see aloop.conf) so vu-meter.py can read levels for every source.
pcm.dup_out {
    type route
    slave.pcm {
        type multi
        slaves.a.pcm "hw:0,0"
        slaves.a.channels 2
        slaves.b.pcm "hw:Loopback,0"
        slaves.b.channels 2
        bindings.0.slave a
        bindings.1.slave a
        bindings.2.slave b
        bindings.3.slave b
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

pcm.mixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "dup_out"
        rate 44100
        format S16_LE
        channels 2
    }
}

pcm.mpd_vol {
    type softvol
    slave.pcm "mixer"
    control {
        name "MPD Volume"
        card 0
    }
    min_dB -50.0
    max_dB 0.0
}

pcm.espeak_vol {
    type softvol
    slave.pcm "mixer"
    control {
        name "ESpeak Volume"
        card 0
    }
    min_dB -50.0
    max_dB 0.0
}

pcm.static_vol {
    type softvol
    slave.pcm "mixer"
    control {
        name "Static Volume"
        card 0
    }
    min_dB -50.0
    max_dB 0.0
}

pcm.spotify_vol {
    type softvol
    slave.pcm "mixer"
    control {
        name "Spotify Volume"
        card 0
    }
    min_dB -50.0
    max_dB 0.0
}

pcm.mpd {
    type plug
    slave.pcm "mpd_vol"
}

pcm.espeak {
    type plug
    slave.pcm "espeak_vol"
}

pcm.static {
    type plug
    slave.pcm "static_vol"
}

pcm.spotify {
    type plug
    slave.pcm "spotify_vol"
}
