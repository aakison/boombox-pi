# Expected location: /etc/mpd.conf

music_directory     "/srv/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
log_file            "/var/log/mpd/mpd.log"
pid_file            "/run/mpd/mpd.pid"
state_file          "/var/lib/mpd/state"

user                "mpd"
bind_to_address     "localhost"
auto_update         "yes"

audio_output {
    type            "alsa"
    name            "USB DAC"
    device          "mpd"
    mixer_type      "software"
} 

# VU meter tap: MPD drains this FIFO itself when full, so playback never blocks on a reader.
# Toggled at runtime by vu-meter.py via `mpc enable/disable "VU Meter"`.
audio_output {
    type            "fifo"
    name            "VU Meter"
    path            "/var/lib/mpd/vu.fifo"
    format          "44100:16:1"
    enabled         "no"
}
